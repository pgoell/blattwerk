# Git hooks. Installed by `mise run install`.
#
# Both hooks stay fast (lint, format and the commit check). The suite takes
# minutes: run it with `mise run test` before a push. CI runs it on every
# pull request and is the gate for the merge.

commit-msg:
  commands:
    cog:
      run: mise exec -- cog verify --file {1} --ignore-merge-commits --ignore-fixup-commits

pre-commit:
  commands:
    lint:
      run: mise run lint

pre-push:
  commands:
    lint:
      run: mise run lint
    check-commits:
      run: mise run check-commits
