name: Setup mise toolchain and caches
description: >
  Bootstraps mise (Python, uv, node, lefthook, cocogitto) and primes the uv cache.
  Assumes the repo has already been checked out by the caller.

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      with:
        install: true
        cache: true
        # From 5.1.1 the action keeps the job's token to itself. The later `mise run` steps
        # keep it, as before, so mise does not ask GitHub without a token and hit the rate limit.
        persist_github_token: true

    - name: Cache uv
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/uv
        key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
        restore-keys: |
          uv-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: |
        uv sync
        npm ci --prefix frontend
