name: Setup mise toolchain and caches
description: >
  Bootstraps mise (Python, uv, node, lefthook, cocogitto) and primes the uv cache.
  Assumes the repo has already been checked out by the caller.

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
      with:
        install: true
        cache: true

    - name: Cache uv
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cache/uv
        key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
        restore-keys: |
          uv-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: |
        uv sync
        npm ci --prefix frontend
