name: Deploy

# Runs on the VPS, on a self-hosted runner. This repo is public, so the only
# trigger is a finished CI run: workflow_run always reads this file from
# master, never from a pull request. Do not add pull_request here, and do not
# put a self-hosted job in any workflow that has it.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

# Never cancel a running deploy.
concurrency: deploy

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to blattwerk.pgoell.com
    # `event == 'push'` matters: the branch filter above also matches a fork's
    # pull request from a branch named master.
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, Linux, X64]
    # No step without a limit of its own can hang for GitHub's six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      # The build runs apt for Chromium's libraries, and a slow mirror can stall
      # it. With an end, a stalled build fails the job. The old container keeps
      # running meanwhile: nothing has changed yet.
      - name: Build image
        timeout-minutes: 15
        run: docker compose build

      # The new image runs on a copy of the data, off the proxy's network and
      # with no port. A fail here stops the job before the live container
      # changes.
      - name: Start the canary on a copy of the data
        timeout-minutes: 3
        run: bash scripts/canary.sh start /home/pascal/.local/share/blattwerk /home/pascal/.local/share/blattwerk-canary

      - name: Smoke test the canary
        timeout-minutes: 5
        run: bash scripts/canary.sh smoke

      # Pass, fail or cancel. After a fail the steps below still do not run.
      - name: Remove the canary and the copy
        if: always()
        run: bash scripts/canary.sh stop /home/pascal/.local/share/blattwerk /home/pascal/.local/share/blattwerk-canary

      # A schema move runs on the first request after a deploy and has no way
      # back. After the build, so the copy is as new as it can be. A failed copy
      # stops the job here, before the live container changes.
      - name: Snapshot the database
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: python3 scripts/snapshot.py /home/pascal/.local/share/blattwerk/blattwerk.db /home/pascal/.local/share/blattwerk-backups "$SHA"

      # The build above moved `latest`. `prev` takes the image of the container
      # that runs now, by its id.
      - name: Keep the running image as prev
        run: bash scripts/keep-prev.sh

      - name: Deploy
        id: up
        run: docker compose up -d

      # The app's logs hold invite tokens and this repo's job logs are public,
      # so a failure points at the logs and does not print them.
      - name: Wait for the app to answer
        run: |
          for _ in $(seq 1 30); do
            if bash scripts/alive.sh blattwerk; then
              echo "blattwerk answers"
              exit 0
            fi
            sleep 2
          done
          echo "::error::blattwerk did not answer on :8000. On the VPS: docker logs blattwerk"
          exit 1

      # Three GETs, no user and no write.
      - name: Smoke test live, read only
        timeout-minutes: 2
        run: docker exec -i blattwerk /app/.venv/bin/python - --read-only http://127.0.0.1:8000 < scripts/smoke.py

      # After a fail, and after a cancel too: a cancel in the wait or in the
      # live smoke test would leave an untested image live. Only once `up` has
      # run: before that the old container still runs and there is nothing to
      # go back from.
      - name: Go back to prev
        if: (failure() || cancelled()) && steps.up.outcome != 'skipped'
        run: bash scripts/go-back.sh

      # Not after a fail: the broken image stays for a look.
      - name: Clean up old images
        run: docker image prune -f
