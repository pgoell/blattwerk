name: Deploy

# No runner on the VPS. The image is built here, on a GitHub-hosted runner, and
# pushed to GHCR. The deploy job then sends the commit sha over SSH, and a copy
# of scripts/deploy.sh that lies on the VPS, in server-infra, runs the steps:
# prev, canary on a copy of the data, smoke test, snapshot, up, and the way
# back. The key can do nothing else: no shell, and nothing of a commit runs on
# the box but its image.
#
# This repo is public, so the only trigger is a finished CI run: workflow_run
# always reads this file from master, never from a pull request. Do not add
# pull_request here: the deploy job holds the key to the VPS.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

# Never cancel a running deploy.
concurrency: deploy

permissions:
  contents: read

jobs:
  build:
    name: Build image
    # `event == 'push'` matters: the branch filter above also matches a fork's
    # pull request from a branch named master. The deploy job needs this one,
    # so it is skipped with it.
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # The build runs apt for Chromium's libraries, and a slow mirror can stall
    # it. With an end, a stalled build fails the job. The old container keeps
    # running meanwhile: nothing has reached the VPS yet.
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ghcr.io/pgoell/blattwerk:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to blattwerk.pgoell.com
    needs: build
    runs-on: ubuntu-latest
    # Above the sum of the limits the script on the VPS sets for its own steps.
    # The script runs to its end even if this job does not.
    timeout-minutes: 60
    # Holds the SSH key, and only master may use it.
    environment: vps
    permissions: {}
    steps:
      # No checkout: this job runs no file of the repo. It sends the sha and
      # nothing else, and the VPS reads it as an image tag.
      - name: Send the commit to the VPS
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_SSH_KEY" >~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$DEPLOY_HOST" "$SHA"
