name: Deploy over SSH

# The deploy that needs no runner on the VPS. The image is built here, on a
# GitHub-hosted runner, and pushed to GHCR. The deploy job then sends the
# commit sha over SSH, and a script that lives on the VPS, in server-infra,
# runs the steps of deploy.yml from there: prev, canary on a copy of the data,
# smoke test, snapshot, up, and the way back. The key can do nothing else: no
# shell, and no script of this repo runs on the box.
#
# By hand only, and from master only, until it has deployed once. Then it takes
# the place of the job in deploy.yml and this file goes.
on:
  workflow_dispatch:

# The same group as deploy.yml: the two never run side by side.
concurrency: deploy

permissions:
  contents: read

jobs:
  build:
    name: Build image
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ghcr.io/pgoell/blattwerk:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to blattwerk.pgoell.com
    needs: build
    runs-on: ubuntu-latest
    # Above the sum of the limits the script on the VPS sets for its own steps.
    # The script runs to its end even if this job does not.
    timeout-minutes: 60
    # Holds the SSH key, and only master may use it.
    environment: vps
    permissions: {}
    steps:
      - name: Send the commit to the VPS
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_SSH_KEY" >~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$DEPLOY_HOST" "$SHA"
