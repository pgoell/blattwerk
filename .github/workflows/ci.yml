name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mise
      - name: Ruff and ty
        run: mise run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    # The Chromium step has hung before; a rerun is quicker than the wait.
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mise
      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: Chromium for the PDF test
        run: uv run playwright install --with-deps --only-shell chromium
      - name: Pytest
        run: mise run test

  commits:
    name: Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
      - name: Conventional commits
        run: mise run check-commits
