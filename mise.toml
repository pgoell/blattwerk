# mise.toml: toolchain pins and task definitions

[tools]
python    = "3.14"
uv        = "latest"
lefthook  = "latest"
cocogitto = "latest"
jq        = "latest"
node      = "22"

# ─── Bootstrap ──────────────────────────────────────────────────────────────

[tasks.install]
description = "Install git hooks and dependencies"
run = [
  "lefthook install",
  "uv sync",
  "npm ci --prefix frontend",
  # The PDF is printed by Chromium.
  "uv run playwright install --only-shell chromium",
]

# ─── Run ────────────────────────────────────────────────────────────────────

[tasks."dev:api"]
description = "Run the backend on :8000 with reload"
run = "uv run uvicorn blattwerk.app:app --reload"

[tasks."dev:web"]
description = "Run the frontend dev server, proxying /api to :8000"
run = "npm run dev --prefix frontend"

[tasks.deps]
description = "Install frontend/node_modules when it is missing, half-written or older than the lock file"
# npm writes node_modules/.package-lock.json as the last step of an install: a missing or older one means redo it.
# npm install can write both in the same tick: as old as the lock is new enough.
run = "test -f frontend/node_modules/.package-lock.json && ! test frontend/package-lock.json -nt frontend/node_modules/.package-lock.json || npm ci --prefix frontend"

[tasks.build]
description = "Build the frontend into the package"
# Skipped while the build is newer than its sources: a build under a running test would swap the files it serves.
sources = ["frontend/src/**/*", "frontend/public/**/*", "frontend/index.html", "frontend/*.json", "frontend/vite.config.ts", "frontend/mcp/**/*", "frontend/mcpb.mjs", "docs/okf/**/*", "src/blattwerk/sheet.schema.json"]
outputs = ["src/blattwerk/static/index.html", "src/blattwerk/static/blattomat.mcpb"]
depends = ["deps"]
run = "npm run build --prefix frontend"

# ─── Testing ────────────────────────────────────────────────────────────────

[tasks.test]
description = "Run tests"
# The PDF test prints the built frontend.
depends = ["build"]
run = "uv run pytest"

[tasks."test:one"]
description = "Run the tests named after --, one worker, stop at the first failure"
depends = ["build"]
run = "uv run pytest -n 0 -x"

[tasks."test:each"]
description = "Run every test named after --, one worker, and report each, failed or not"
depends = ["build"]
run = "uv run pytest -n 0"

[tasks."test:flaky"]
description = "Run the tests named after -- 20 times side by side"
depends = ["build"]
run = "bash scripts/test-flaky.sh"

[tasks."test:webkit"]
description = "Run the browser tests in WebKit; node ids and pytest flags go after --"
depends = ["build"]
run = "bash scripts/test-webkit.sh"

[tasks."test:native"]
description = "Run the tests marked native in a real window under xvfb; node ids go after --"
depends = ["build"]
# One worker: two windows on one screen would fight for the keys.
env = { BLATTWERK_NATIVE = "1" }
run = "xvfb-run -a uv run pytest -n 0"

[tasks."test:model"]
description = "Run the sheet model's property tests: vitest and fast-check, no browser"
depends = ["deps"]
run = "npm test --prefix frontend"

[tasks.shot]
description = "Print a sheet: the editor as PNG and the PDF as PNG, into the folder given"
depends = ["build"]
run = "uv run python scripts/shot.py"

[tasks.eval]
description = "Run the teacher tasks in tests/evals against Claude through the MCP, on the subscription; not in CI"
depends = ["build", "deps"]
run = "uv run python scripts/eval.py"

# ─── Stage ──────────────────────────────────────────────────────────────────

[tasks."stage:up"]
description = "Start the live image on a fresh copy of the live data, on 127.0.0.1:8220, and print a test teacher's login"
run = "bash scripts/stage.sh up"

[tasks."stage:down"]
description = "Remove the stage's container and its copy of the data"
run = "bash scripts/stage.sh down"

[tasks."teacher:page"]
description = "A real window with a real mouse on the stage, for the teacher run; a verb goes after --: start, click, hover, screenshot, stop"
run = "uv run python scripts/teacher-page.py"

# ─── Lint & format ──────────────────────────────────────────────────────────

[tasks.lint]
description = "Lint, format-check and type-check"
depends = ["deps"]
run = [
  "uv run ruff check",
  "uv run ruff format --check",
  "uv run ty check",
  "npm run typecheck --prefix frontend",
  # The schema the server checks a saved sheet against comes from the types: it fails where they moved apart.
  "npm run schema --prefix frontend -- --check",
  # The block pages in docs/okf/blocks come from the same schema: it fails where a page differs from it.
  "npm run okf --prefix frontend -- --check",
  # The docs bundle keeps up with the schema, the recipes, the evals and the server's error texts.
  "uv run python scripts/okf_check.py",
]

[tasks.schema]
description = "Write src/blattwerk/sheet.schema.json from the sheet's types in frontend/src"
depends = ["deps"]
run = [
  "npm run schema --prefix frontend",
  "npm run okf --prefix frontend",
]

[tasks.fmt]
description = "Auto-format"
run = "uv run ruff format"

# ─── Commits ────────────────────────────────────────────────────────────────

[tasks.check-commits]
description = "Verify commits since origin/master are conventional"
# Before the first push there is no origin/master: check the whole history.
run = '''
if git rev-parse -q --verify origin/master >/dev/null; then
  cog check origin/master..HEAD
else
  cog check
fi
'''

# ─── GitHub repo config ─────────────────────────────────────────────────────

[tasks."repo:apply-settings"]
description = "Apply GitHub repo + branch-protection settings from .github/*.json, turn on Dependabot security updates"
run = "bash scripts/apply-github-settings.sh"

[tasks."repo:check-settings"]
description = "Diff live branch protection against .github/branch-protection.json, check security settings"
run = "bash scripts/apply-github-settings.sh --check"
