# Fixed name, so a deploy from the runner's checkout replaces the same project.
name: blattwerk

services:
  blattwerk:
    build: .
    container_name: blattwerk
    restart: unless-stopped
    networks:
      - web
    volumes:
      - /home/pascal/.local/share/blattwerk:/data

networks:
  web:
    external: true
    name: web
