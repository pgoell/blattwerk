# The same project and container name as the compose file the deploy runs on the VPS
# (server-infra, deploy/blattwerk/compose.yaml). That one has no `build`: its image comes from GHCR.
name: blattwerk

services:
  blattwerk:
    build: .
    container_name: blattwerk
    restart: unless-stopped
    networks:
      - web
    volumes:
      - /home/pascal/.local/share/blattwerk:/data

networks:
  web:
    external: true
    name: web
