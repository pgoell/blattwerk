[project]
name = "blattwerk"
version = "0.1.0"
description = "Worksheet tool for Grundschule teachers"
readme = "README.md"
authors = [
    { name = "pgoell", email = "pascal98kraus@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "fastapi>=0.142.2",
    "playwright>=1.63.0",
    "pypdf>=6.19.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.168.5",
    "pillow>=12.3.0",
    "pypdfium2>=5.14.0",
    "pytest",
    "pytest-repeat>=0.9.4",
    "pytest-xdist>=3.8.0",
    "ruff",
    "ty",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto"
markers = [
  "webkit_xfail(issue, why): the test fails in WebKit for the reason the issue tells",
  "native: runs headed under xvfb (mise run test:native), with the mouse and the keys only",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ty.environment]
python-version = "3.14"
