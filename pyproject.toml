[project]
name = "blattwerk"
version = "0.1.0"
description = "Worksheet tool for Grundschule teachers"
readme = "README.md"
authors = [
    { name = "pgoell", email = "pascal98kraus@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "markdown>=3.11.1",
    "playwright>=1.64.0",
    "pypdf>=6.19.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.168.5",
    "mcp>=2.3.0",
    "pillow>=12.3.0",
    "pypdfium2>=5.14.0",
    "pytest",
    "pytest-repeat>=0.9.4",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "pyyaml>=6.0.3",
    "ruff",
    "ty",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# worksteal: a worker with nothing left takes tests from one that still has some. Without it two
# workers ran on alone for two minutes at the end of a run of ten (#439). CI asks for the same.
addopts = "-n auto --dist worksteal"
# A test that hangs fails alone and by its name within a minute, and the run goes on (#340). The
# few tests that take over 30 s on CI carry a longer limit of their own. By thread: the worker of
# the hung test ends, xdist names the test and starts another worker. A signal fails the test and
# keeps the worker, but one that fires inside a Playwright call leaves the worker spinning (#344).
timeout = 60
timeout_method = "thread"
# The worker that ends takes its stacks along, so a test that hangs says where shortly before.
faulthandler_timeout = 50
markers = [
  "webkit_xfail(issue, why): the test fails in WebKit for the reason the issue tells",
  "native: runs headed under xvfb (mise run test:native), with the mouse and the keys only",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
per-file-ignores = { "tests/*" = ["E501"] }

[tool.ty.environment]
python-version = "3.14"
