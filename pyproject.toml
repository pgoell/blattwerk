[project]
name = "blattwerk"
version = "0.1.0"
description = "Worksheet tool for Grundschule teachers"
readme = "README.md"
authors = [
    { name = "pgoell", email = "pascal98kraus@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "fastapi>=0.142.2",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest",
    "ruff",
    "ty",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ty.environment]
python-version = "3.14"
